[project]
name = "tekmor"
version = "0.0.0"
description = "A measurable safety layer for tool-using LLM agents"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Ghassen Naouar" }]
# Runtime dependencies are intentionally empty. See "Dependency Discipline" in CLAUDE.md
# before adding one.
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tekmor"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: needs a real model backend or a GPU; excluded from the default run",
]
