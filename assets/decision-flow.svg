<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="980" height="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Tekmor decision flow: every tool call is mediated before it executes</title>
  <desc>A candidate tool call passes through least privilege, Permitted-Flow and Trusted-Action in fixed order, producing ALLOW, BLOCK, ESCALATE or REWRITE. Any internal error fails closed to BLOCK.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a868f"/>
    </marker>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6f9f"/>
    </marker>
  </defs>

  <rect width="980" height="430" fill="#ffffff"/>

  <!-- inputs -->
  <text x="20" y="28" font-size="13" font-weight="700" fill="#1d2630">Inputs</text>
  <g font-size="12" fill="#1d2630">
    <rect x="20" y="42" width="168" height="40" rx="6" fill="#f2f5f7" stroke="#d3dae0"/>
    <text x="32" y="60" font-weight="600">state</text>
    <text x="32" y="75" font-size="10.5" fill="#5b6770">the user's task, step</text>

    <rect x="20" y="92" width="168" height="40" rx="6" fill="#f2f5f7" stroke="#d3dae0"/>
    <text x="32" y="110" font-weight="600">action</text>
    <text x="32" y="125" font-size="10.5" fill="#5b6770">proposed call + arguments</text>

    <rect x="20" y="142" width="168" height="40" rx="6" fill="#e8f0f6" stroke="#2f6f9f"/>
    <text x="32" y="160" font-weight="600" fill="#215a80">provenance</text>
    <text x="32" y="175" font-size="10.5" fill="#5b6770">every source read, labelled</text>

    <rect x="20" y="192" width="168" height="40" rx="6" fill="#f2f5f7" stroke="#d3dae0"/>
    <text x="32" y="210" font-weight="600">policy</text>
    <text x="32" y="225" font-size="10.5" fill="#5b6770">sensitive tools, rewrites</text>
  </g>

  <path d="M 192 137 L 236 137" stroke="#7a868f" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- the monitor -->
  <rect x="240" y="40" width="330" height="290" rx="10" fill="#ffffff" stroke="#2f6f9f" stroke-width="2"/>
  <text x="258" y="66" font-size="13" font-weight="700" fill="#215a80">Reference monitor</text>
  <text x="258" y="83" font-size="10.5" fill="#5b6770">rules run in fixed order; first match decides</text>

  <g font-size="12">
    <rect x="258" y="96" width="294" height="44" rx="6" fill="#f2f5f7" stroke="#d3dae0"/>
    <text x="272" y="114" font-weight="600" fill="#1d2630">1 &#183; Least privilege</text>
    <text x="272" y="130" font-size="10.5" fill="#5b6770">is this tool permitted for this task at all?</text>

    <rect x="258" y="148" width="294" height="44" rx="6" fill="#f2f5f7" stroke="#d3dae0"/>
    <text x="272" y="166" font-weight="600" fill="#1d2630">2 &#183; Permitted-Flow</text>
    <text x="272" y="182" font-size="10.5" fill="#5b6770">would this send data where it may not go?</text>

    <rect x="258" y="200" width="294" height="52" rx="6" fill="#e8f0f6" stroke="#2f6f9f"/>
    <text x="272" y="218" font-weight="600" fill="#215a80">3 &#183; Trusted-Action</text>
    <text x="272" y="234" font-size="10.5" fill="#5b6770">is this sensitive call driven by influences</text>
    <text x="272" y="247" font-size="10.5" fill="#5b6770">below the integrity threshold?</text>

    <rect x="258" y="260" width="294" height="30" rx="6" fill="#fdf1ee" stroke="#c4452d"/>
    <text x="272" y="280" font-size="11" fill="#8f3221"><tspan font-weight="600">Fail closed</tspan> &#183; any error becomes BLOCK</text>
  </g>
  <text x="258" y="312" font-size="10.5" fill="#5b6770">Risk score is computed from the same signals &#8212; it describes, it does not decide.</text>

  <path d="M 574 137 L 620 137" stroke="#2f6f9f" stroke-width="1.6" fill="none" marker-end="url(#arrowDark)"/>

  <!-- verdicts -->
  <text x="624" y="28" font-size="13" font-weight="700" fill="#1d2630">Decision</text>
  <g font-size="12">
    <rect x="624" y="42" width="336" height="38" rx="6" fill="#eef6f0" stroke="#3f8f5f"/>
    <text x="638" y="66" fill="#2a6b45"><tspan font-weight="700">ALLOW</tspan>  &#8212;  the call runs as proposed</text>

    <rect x="624" y="88" width="336" height="52" rx="6" fill="#e8f0f6" stroke="#2f6f9f"/>
    <text x="638" y="108" fill="#215a80"><tspan font-weight="700">REWRITE</tspan>  &#8212;  replaced by a safer sibling</text>
    <text x="638" y="127" font-size="10.5" fill="#5b6770">send_email &#8594; draft_email, execute &#8594; prepare</text>

    <rect x="624" y="148" width="336" height="52" rx="6" fill="#fdf8ec" stroke="#c99a2e"/>
    <text x="638" y="168" fill="#8a6816"><tspan font-weight="700">ESCALATE</tspan>  &#8212;  deferred to a human</text>
    <text x="638" y="187" font-size="10.5" fill="#5b6770">scored as a refusal: no human in evaluation</text>

    <rect x="624" y="208" width="336" height="38" rx="6" fill="#fdf1ee" stroke="#c4452d"/>
    <text x="638" y="232" fill="#8f3221"><tspan font-weight="700">BLOCK</tspan>  &#8212;  the call does not run</text>
  </g>

  <rect x="624" y="262" width="336" height="68" rx="6" fill="#f2f5f7" stroke="#d3dae0"/>
  <text x="638" y="282" font-size="11.5" font-weight="600" fill="#1d2630">Every decision emits a trace event</text>
  <text x="638" y="300" font-size="10.5" fill="#5b6770">Reason codes are the predicates that fired, so the</text>
  <text x="638" y="314" font-size="10.5" fill="#5b6770">explanation cannot disagree with the decision.</text>

  <text x="20" y="360" font-size="11" fill="#5b6770">
    <tspan font-weight="600" fill="#1d2630">Complete mediation.</tspan> No path to a tool bypasses this function.
  </text>
  <text x="20" y="380" font-size="11" fill="#5b6770">
    <tspan font-weight="600" fill="#1d2630">Monotone-safe layers.</tspan> The canary scanner and the alignment auditor may only raise a verdict, never soften one.
  </text>
  <text x="20" y="400" font-size="11" fill="#5b6770">
    <tspan font-weight="600" fill="#1d2630">Tamper resistance.</tspan> Policy and thresholds carry SYSTEM_POLICY trust and are never writable by observed content.
  </text>
</svg>
